packages:
  - name: invenio-administration
    oarepo: 13
    features:
      - name: multiple-ui-changes-from-3.1.2
        base: v3.1.2

  - name: invenio-app-rdm
    oarepo: 13
    entrypoints:
      - invenio-version: "<13.0.0"
        remove: "*"
        keep:
          - group: invenio_assets.webpack
            name: invenio_app_rdm_theme
    features:
      - name: removed-webpack-aliases
        base: v12.0.12

  - name: invenio-banners
    oarepo: 13
    features:
      - name: message-htmleditor
        base: v3.1.1
        invenio-version: "<3.2.0"

  - name: invenio-rdm-records
    oarepo: 13
    features:
      - name: transfers
        base: v10.9.1
        invenio-version: "<11.0.0"
      - name: optional-pids
        base: v10.9.2
        invenio-version: "<11.0.0"
    depends:
      - "on": invenio-records-resources
      - "on": invenio-drafts-resources
    entrypoints:
      - invenio-version: "<11.0.0"
        remove: "*"
        keep:
          - group: invenio_jsonschemas.schemas
            name: invenio_rdm_records
          - group: invenio_assets.webpack
            name: invenio_rdm_records
          - group: invenio_i18n.translations
            name: invenio_rdm_records
    dependencies:
      - extra: tests
        remove: "*"

  - name: invenio-communities
    oarepo: 13
    features:
      - name: disable-communities-ui-from-18.1.0
        base: v18.1.0
      - name: enable-email-invitations-from-18.1.0
        base: v18.1.0
      - name: administration-in-tests-from-18.1.0
        base: v18.1.0

  - name: invenio-drafts-resources
    oarepo: 13
    features:
      # - name: kwargs-from-6.0.0
      #   base: v6.0.0
      - name: transfers # based on kwargs with merged contribution-transfer-registry
        base: v3.2.0
    depends:
      - "on": invenio-records-resources

  - name: invenio-records-resources
    oarepo: 13
    features:
      # - name: kwargs-from-7.1.0
      #   base: v7.1.0
      - name: multipart-upload
        base: v5.10.0
        invenio-version: "<5.11.1"
      - name: multipart-upload-from-5.11.1
        base: v5.11.1


  - name: invenio-requests
    oarepo: 13
    features:
      - name: kwargs-from-6.2.0
        base: v6.2.0

  - name: invenio-s3
    oarepo: 13
    features:
      - name: multipart-upload-from-2.0.1
        base: v2.0.1

  - name: invenio-oauthclient
    oarepo: 13
    features:
      - name: refresh-token-from-5.1.0
        base: v5.1.0

  - name: invenio-jsonschemas
    oarepo: 13
    features:
      - name: importlib-files
        base: v2.0.0

  - name: invenio-search
    oarepo: 13
    features:
      - name: importlib
        base: v3.1.0

  - name: citeproc-py-styles
    oarepo: 13
    features:
        - name: czech-iso-citation
          base: v0.1.3

  - name: invenio-vocabularies
    oarepo: 13
    features:
      - name: search-on-identifiers-in-specialized-vocabs
        base: v3.4.0

  - name: invenio-oaiserver
    oarepo: 13
    features:
      - name: enable-multiple-record-types
        base: v2.2.1