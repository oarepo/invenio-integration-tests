invenio-version: 14.0.0b5.dev3

packages:
  - name: invenio-administration
    features:
      - name: oarepo-feature-multiple-ui-changes-from-3.1.2
        base: v3.1.2

  - name: invenio-app-rdm
    entrypoints:
      - remove:
          - group: invenio_base.blueprints
            name: invenio_app_rdm_records
            _value: invenio_app_rdm.records_ui.views:create_blueprint

          - group: invenio_base.blueprints
            name: invenio_app_rdm
            _value: invenio_app_rdm.theme.views:create_blueprint

          # this needs to be excluded as we provide our own config
          - group: invenio_config.module
            name: invenio_app_rdm
            _value: invenio_app_rdm.config

          # TODO: not sure if this should be enabled, so keeping it disabled
          - group: invenio_base.finalize_app
            name: invenio_app_rdm
            _value: invenio_app_rdm.ext:finalize_app

      # extra entrypoints from rdm-records that are needed for tests to pass
      # note: we might to add oarepo-runtime, oarepo-rdm etc here so that we test
      # the actual setup that is used in oarepo-based repositories
      - tests: |
          flask.commands =
              rdm-records = invenio_rdm_records.cli:rdm_records
          invenio_base.apps =
              invenio_rdm_records = invenio_rdm_records:InvenioRDMRecords
          invenio_base.api_apps =
              invenio_rdm_records = invenio_rdm_records:InvenioRDMRecords
          invenio_base.blueprints =
              invenio_rdm_records_ext = invenio_rdm_records.views:blueprint
          invenio_base.api_blueprints =
              invenio_rdm_records = invenio_rdm_records.views:create_records_bp
              invenio_rdm_records_draft_files = invenio_rdm_records.views:create_draft_files_bp
              invenio_rdm_records_draft_media_files = invenio_rdm_records.views:create_draft_media_files_bp
              invenio_rdm_records_ext = invenio_rdm_records.views:blueprint
              invenio_rdm_records_parent_links = invenio_rdm_records.views:create_parent_record_links_bp
              invenio_rdm_records_parent_grants = invenio_rdm_records.views:create_parent_grants_bp
              invenio_rdm_records_user_access = invenio_rdm_records.views:create_grant_user_access_bp
              invenio_rdm_records_group_access = invenio_rdm_records.views:create_grant_group_access_bp
              invenio_rdm_records_record_files = invenio_rdm_records.views:create_record_files_bp
              invenio_rdm_records_record_media_files = invenio_rdm_records.views:create_record_media_files_bp
              invenio_rdm_community_records = invenio_rdm_records.views:create_community_records_bp
              invenio_oaipmh_server = invenio_rdm_records.views:create_oaipmh_server_blueprint_from_app
              invenio_rdm_record_communities = invenio_rdm_records.views:create_record_communities_bp
              invenio_rdm_record_requests = invenio_rdm_records.views:create_record_requests_bp
              invenio_iiif = invenio_rdm_records.views:create_iiif_bp
          invenio_base.finalize_app =
              invenio_rdm_records = invenio_rdm_records.ext:finalize_app
          invenio_base.api_finalize_app =
              invenio_rdm_records = invenio_rdm_records.ext:api_finalize_app
          invenio_celery.tasks =
              invenio_rdm_records_fixtures = invenio_rdm_records.fixtures.tasks
              invenio_rdm_records_services = invenio_rdm_records.services.tasks
              invenio_rdm_records_access_requests = invenio_rdm_records.requests.access.tasks
              invenio_rdm_records_iiif = invenio_rdm_records.services.iiif.tasks
              invenio_rdm_records_user_moderation = invenio_rdm_records.requests.user_moderation.tasks
          invenio_db.models =
              invenio_rdm_records = invenio_rdm_records.records.models
          invenio_db.alembic =
              invenio_rdm_records = invenio_rdm_records:alembic
          # we keep these in our rdm-records build, commented out so not duplicated
          # invenio_jsonschemas.schemas =
          #     invenio_rdm_records = invenio_rdm_records.records.jsonschemas
          invenio_search.mappings =
              rdmrecords = invenio_rdm_records.records.mappings
          # we keep these in our rdm-records build, commented out so not duplicated
          # invenio_i18n.translations =
          #     invenio_rdm_records = invenio_rdm_records
          invenio_requests.types =
              community_inclusion = invenio_rdm_records.requests.community_inclusion:get_request_type
              community_submission = invenio_rdm_records.requests.community_submission:get_request_type
              user_access_request = invenio_rdm_records.requests:UserAccessRequest
              guest_access_request = invenio_rdm_records.requests:GuestAccessRequest
          invenio_requests.entity_resolvers =
              records = invenio_rdm_records.requests.entity_resolvers:RDMRecordResolver
              email = invenio_rdm_records.requests.entity_resolvers:EmailResolver
          invenio_administration.views =
              invenio_rdm_records_oai_list = invenio_rdm_records.administration.views.oai:OaiPmhListView
              invenio_rdm_records_oai_edit = invenio_rdm_records.administration.views.oai:OaiPmhEditView
              invenio_rdm_records_oai_create = invenio_rdm_records.administration.views.oai:OaiPmhCreateView
              invenio_rdm_records_details = invenio_rdm_records.administration.views.oai:OaiPmhDetailView
          # we keep these in our rdm-records build, commented out so not duplicated
          # invenio_assets.webpack =
          #     invenio_rdm_records = invenio_rdm_records.webpack:theme
          invenio_oauth2server.scopes =
              tokens_generate_scope = invenio_rdm_records.tokens.scopes:tokens_generate_scope
          invenio_users_resources.moderation.actions =
              block = invenio_rdm_records.requests.user_moderation.actions:on_block
              restore = invenio_rdm_records.requests.user_moderation.actions:on_restore
              approve = invenio_rdm_records.requests.user_moderation.actions:on_approve
          invenio_jobs.jobs =
              update_expired_embargos = invenio_rdm_records.jobs.jobs:update_expired_embargos_cls

    features:
      - name: oarepo-feature-removed-webpack-aliases
        base: v12.0.12
      - name: oarepo-feature-request-view
        base: v14.0.0b10.dev7

  - name: invenio-rdm-records
    features:
      - name: oarepo-feature-configurable-service-resource
        base: v19.5.4
        invenio-version: "<28.2.0"
      - name: oarepo-feature-configurable-service-resource-from-28.2.0
        base: v28.2.0
        invenio-version: ">=28.2.0"
      - name: oarepo-feature-kwargs
        base: v19.5.4
      - name: oarepo-feature-pids-component-permission-check-args
        base: v19.5.4
      - name: oarepo-feature-review-service-components
        base: v22.7.3
      - name: oarepo-feature-review-before-doi-assign
        base: v22.7.3
    entrypoints:
      - remove:
          - group: invenio_search.mappings
            name: rdmrecords
            _value: invenio_rdm_records.records.mappings

    tests:
      - testopts: "--deselect tests/services/test_service_review.py::test_delete_draft_unsubmitted"
        invenio-version: ">=20.0.1,<=20.0.1"
      - testopts: "--deselect tests/resources/test_access_requests.py::test_simple_guest_access_request_flow"
        invenio-version: ">=20.0.1,<=20.0.1"

  - name: invenio-communities
    features:
      - name: oarepo-feature-disable-communities-ui-from-25.0.0
        base: v25.0.0
        invenio-version: ">=25.0.0"
      - name: oarepo-feature-disable-communities-ui-from-21.0.0
        base: v21.0.0
        invenio-version: ">=21.0.0,<25.0.0"
      - name: oarepo-feature-enable-email-invitations-from-25.0.0
        base: v25.0.0
        invenio-version: ">=25.0.0,<27.0.0"
      - name: oarepo-feature-enable-email-invitations-from-27.0.0
        base: v27.0.0
        invenio-version: ">=27.0.0"
      - name: oarepo-feature-enable-email-invitations-from-19.1.0
        base: v19.1.0
        invenio-version: "<25.0.0"
      - name: oarepo-feature-administration-in-tests-from-19.1.0
        base: v19.1.0

  - name: invenio-drafts-resources
    depends:
      - "on": invenio-records-resources
    features:
      - name: oarepo-feature-kwargs-from-7.2.0
        base: v7.2.0
      - name: oarepo-feature-publish-edit-test-temp-skip
        base: v7.3.0

  - name: invenio-records-resources
    features:
      - name: oarepo-feature-kwargs-from-10.0.0
        base: v10.0.0
        invenio-version: ">=10.0.0"
      - name: oarepo-feature-kwargs-from-8.6.0
        base: v8.6.0
        invenio-version: ">=8.6.0,<10.0.0"
      - name: oarepo-feature-lenient-labelled-facets
        base: v8.8.0

  - name: invenio-requests
    features:
      - name: oarepo-feature-kwargs-from-12.2.1
        base: v12.2.1
      - name: oarepo-feature-refresh-and-configs-from-12.3.0
        base: v12.3.0
        invenio-version: ">=12.3.0"
      - name: oarepo-feature-refresh-and-configs
        base: v10.0.1
        invenio-version: "<12.3.0"

  - name: invenio-jsonschemas
    features:
      - name: oarepo-feature-importlib-files
        base: v2.0.0

  - name: invenio-search
    features:
      - name: oarepo-feature-importlib
        base: v3.1.0

  - name: citeproc-py-styles
    features:
      - name: oarepo-feature-czech-iso-citation-from-0.1.5
        base: v0.1.5

  - name: invenio-vocabularies
    features:
      - name: oarepo-feature-configurable-service-resource-from-9.0.0
        base: v9.0.0
      - name: oarepo-feature-pass-more-context-permissions
        base: v9.0.0
      - name: oarepo-feature-harvest-record
        base: v9.1.2

  - name: invenio-oaiserver
    features:
      - name: oarepo-feature-enable-multiple-record-types-from-3.6.0
        base: v3.6.0

  - name: invenio-notifications
    features:
      - name: oarepo-feature-lazy-strings-from-1.3.0
        base: v1.3.0
        invenio-version: ">=1.3.0"
      - name: oarepo-feature-lazy-strings
        base: v1.2.2
        invenio-version: "<1.3.0"

  # Patches that are not yet released
  - name: invenio-config
    features:
      - base: 0f1fde1a9c4ebd6fd0876d81a594bf60d407ca9e
        name: b7c969e0596ace9373d634250b15aa0394110cfa
        org: inveniosoftware

  - name: invenio-files-rest
    features:
      - name: 616dc34c38006433653211feb5a9e523b0d399e7
        base: 131594c9324dc6cc353d868affd5788509bae45f
        org: inveniosoftware

  - name: invenio-mail
    features:
      - name: 44c157a4cadcb064c695f3e6bc11788e38fa50fb
        base: ef1d2b7f41642653a2c5c7813083cbbbf134256b
        org: inveniosoftware

  - name: invenio-queues
    features:
      - name: 7ec1c68c2a3461c4aab71650252b47e86d2cc896
        base: 77e5549a8c905b58908e6314508ea9e0336cb3c7
        org: inveniosoftware
