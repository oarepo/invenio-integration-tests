name: "Install build tools from this repository/build_tools"
runs:
  using: "composite"
  steps:
    - name: Create virtualenv for build tools
      shell: "bash"
      run: | # shell
        cd build_tools
        uv venv --seed
        uv pip install -U "setuptools<82.0.0"
        source .venv/bin/activate
        uv pip install -e .
