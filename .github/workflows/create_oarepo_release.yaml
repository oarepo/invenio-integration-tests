name: Create oarepo release

# This is the main script to be run to create a new release of oarepo tooling.
# It is triggered manually by the user or automatically during weekly builds.
#
# What it does
# 1. It checks out the repository and prepares the tools virtualenv.
# 2. It determines the base repository to use for the testrig (oarepo/invenio-testrig for testing, zenodo/zenodo-rdm for production) and gets the list of patches to apply from the invenio-forks.yaml configuration file.
# 3. It runs the invenio-testrig workflow to test the patches on the base repository
on:
  workflow_dispatch:
    inputs:
      python:
        description: Python version
        required: true
        default: "3.14.2"

env:
  PYTHON_VERSION: ${{ github.event.inputs.python || '3.14.2' }}

permissions:
  id-token: write
  contents: write
  pages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      base_repository: ${{ steps.set-repository.outputs.base_repository }}
      patches: ${{ steps.set-repository.outputs.patches }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Prepare python and tools
        uses: ./.github/actions/action-install-tools
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set the correct repository for the testrig and get a list of patches to apply
        id: set-repository
        shell: bash
        run: |
          # Use oarepo/inveniordm-reference-repo for testing
          echo "Using repository oarepo/inveniordm-reference-repo"
          echo "base_repository=oarepo/inveniordm-reference-repo" >> $GITHUB_OUTPUT

          invenio-integration-tests setup invenio-forks.yaml workdir
          mapfile -t patches < <(jq -r '.patches[]' workdir/integration-tests-config.json)

          echo "patches=${patches[*]}" >> $GITHUB_OUTPUT

  run_invenio_testrig:
    needs: prepare
    uses: oarepo/invenio-testrig/.github/workflows/verify-patches.yml@master
    with:
      name: Extract requirements from Zenodo and test the forks
      repository: ${{ needs.prepare.outputs.base_repository }}
      disable-codestyle-checks: true
      python-version: 3.14.2
      skip-report: true
      patches: ${{ needs.prepare.outputs.patches }}
      patch-mode: "pinned-rebase"
      test-mode: "stop-on-success" # do not run unpatched tests if the patches are ok

  upload_patches_to_pypi:
    needs: run_invenio_testrig
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Prepare python and tools
        uses: ./.github/actions/action-install-tools
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download the workdir artifact
        uses: actions/download-artifact@v3
        with:
          name: workdir
          path: workdir

      - name: Upload original packages to the package registry
        shell: bash
        run: |
          invenio-integration-tests upload-original workdir

      - name: Update entrypoints in patched packages
        shell: bash
        run: |
          invenio-integration-tests update-entrypoints workdir

      - name: Find distributions for patched packages
        shell: bash
        run: |
          invenio-integration-tests find-distributions workdir

      - name: Build source and wheel distributions
        shell: bash
        run: |
          invenio-integration-tests build-distributions workdir

      - name: Upload distributions to CESNET registry
        shell: bash
        run: |
          invenio-integration-tests upload-distributions workdir

      - name: Create github app token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.OAREPO_BUMP_VERSION_CLIENT_ID }}
          private-key: ${{ secrets.OAREPO_BUMP_VERSION_CLIENT_PASSWORD }}

      - name: Get OARepo version from the testrig configuration
        id: get-version
        shell: bash
        run: |
          OAREPO_VERSION=$(invenio-integration-tests oarepo-version --major workdir)
          echo "OAREPO_VERSION=$OAREPO_VERSION" >> $GITHUB_ENV
          echo "Going to create release for OARepo version $OAREPO_VERSION"

      - name: Checkout oarepo/oarepo under workdir/oarepo
        uses: actions/checkout@v4
        with:
          repository: "oarepo/oarepo"
          ref: "rdm-${{ env.OAREPO_VERSION }}"
          token: ${{ steps.app-token.outputs.token }}
          path: "workdir/oarepo"

      - name: Update oarepo package version and dependencies
        shell: bash
        run: |
          invenio-integration-tests update-oarepo workdir

